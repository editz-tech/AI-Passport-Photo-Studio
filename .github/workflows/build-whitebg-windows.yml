name: Build E-PIX BG STUDIO for Windows

on:
  push:
    branches: ["build/whitebg-standalone"]
    paths:
      - "WhiteBGStudio/**"
      - ".github/workflows/build-whitebg-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: WhiteBGStudio/requirements.txt
      - name: Install dependencies
        working-directory: WhiteBGStudio
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Prepare E-PIX desktop icon
        working-directory: WhiteBGStudio
        run: |
          python icon_builder.py
      - name: Download and bundle U2-Net model
        working-directory: WhiteBGStudio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .u2net | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx" -OutFile ".u2net\u2net.onnx"
          if (!(Test-Path ".u2net\u2net.onnx")) { throw "U2-Net model download failed." }
      - name: Build Windows executable
        working-directory: WhiteBGStudio
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "E-PIX BG STUDIO" --icon "e-pix-icon.ico" --collect-all onnxruntime --hidden-import numpy --add-data ".u2net;.u2net" app.py
      - name: Require trusted Authenticode signing
        working-directory: WhiteBGStudio
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Trusted code-signing certificate secrets are missing. Add WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD in repository Settings > Secrets and variables > Actions."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "epix-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD "dist\E-PIX BG STUDIO.exe"
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed with exit code $LASTEXITCODE." }
            & $signtool.FullName verify /pa /v "dist\E-PIX BG STUDIO.exe"
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed." }
            Write-Host "E-PIX BG STUDIO executable signed and signature verified."
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "WhiteBGStudio\dist\E-PIX BG STUDIO.exe" "release\E-PIX BG STUDIO.exe"
          Copy-Item "WhiteBGStudio\README.txt" "release\README.txt"
          Compress-Archive -Path "release\*" -DestinationPath "E-PIX-BG-STUDIO-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: E-PIX-BG-STUDIO-Windows
          path: E-PIX-BG-STUDIO-Windows.zip
          if-no-files-found: error
          retention-days: 14
