name: Build E-PIX BG STUDIO for Windows

on:
  push:
    branches: ["build/whitebg-standalone"]
    paths:
      - "WhiteBGStudio/**"
      - ".github/workflows/build-whitebg-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: WhiteBGStudio/requirements.txt
      - name: Install dependencies
        working-directory: WhiteBGStudio
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Prepare E-PIX desktop icon
        working-directory: WhiteBGStudio
        run: |
          python icon_builder.py
      - name: Download and bundle U2-Net model
        working-directory: WhiteBGStudio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .u2net | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx" -OutFile ".u2net\u2net.onnx"
          if (!(Test-Path ".u2net\u2net.onnx")) { throw "U2-Net model download failed." }
      - name: Build Windows executable
        working-directory: WhiteBGStudio
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "E-PIX BG STUDIO" --icon "e-pix-icon.ico" --collect-all onnxruntime --hidden-import numpy --add-data ".u2net;.u2net" --add-data "e-pix-icon.ico;." app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        working-directory: WhiteBGStudio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\\release | Out-Null
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "E-PIX-BG-STUDIO.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
      - name: Package portable build too
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item "WhiteBGStudio\\dist\\E-PIX BG STUDIO.exe" "portable\\E-PIX BG STUDIO.exe"
          Copy-Item "WhiteBGStudio\\README.txt" "portable\\README.txt"
          Compress-Archive -Path "portable\\*" -DestinationPath "E-PIX-BG-STUDIO-Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: E-PIX-BG-STUDIO-Windows-Installer
          path: |
            release/E-PIX-BG-STUDIO-Setup.exe
            E-PIX-BG-STUDIO-Portable.zip
          if-no-files-found: error
          retention-days: 14
