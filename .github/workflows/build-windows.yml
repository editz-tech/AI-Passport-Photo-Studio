name: Build and publish Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        run: python -m compileall -q app.py

      - name: Download and prepare the AI model for offline use
        shell: pwsh
        run: |
          $env:U2NET_HOME = "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force -Path $env:U2NET_HOME | Out-Null
          python -c "from rembg import new_session; new_session('u2net')"
          if (-not (Test-Path "$env:U2NET_HOME\models\u2net\u2net.onnx")) {
            throw "The U2Net model was not downloaded to the expected location."
          }

      - name: Build standalone application
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AI-Passport-Photo-Studio
          --collect-all rembg
          --collect-all onnxruntime
          --collect-all pooch
          --collect-all pymatting
          --collect-all PIL
          --add-data "models;models"
          app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows setup installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=1.0.$env:GITHUB_RUN_NUMBER" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\installer\AI-Passport-Photo-Studio-Setup.exe")) {
            throw "The setup installer was not created."
          }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Passport-Photo-Studio-Setup
          path: dist/installer/AI-Passport-Photo-Studio-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Passport Photo Studio v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows 10/11 (64-bit) installer.

            - Installs the desktop application.
            - Creates a Start Menu shortcut and an optional desktop shortcut.
            - Includes the background-removal runtime and U2Net model for offline use.
            - Includes a Windows uninstaller.

            Note: This installer is not code-signed; Windows SmartScreen may show an unknown-publisher warning.
          files: dist/installer/AI-Passport-Photo-Studio-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true
